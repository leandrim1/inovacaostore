<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <title>Inovação Store | Roupas Masculinas Nacionais e Importadas</title>
    <meta
      name="description"
      content="Inovação Store — moda masculina em Patos de Minas. Camisetas, camisas, calças, bermudas, jaquetas e acessórios nacionais e importados. Compre online com frete para todo o Brasil."
    />
    <meta property="og:site_name" content="Inovação Store" />
    <meta property="og:locale" content="pt_BR" />
    <!-- Fontes autohospedadas (public/fonts). A folha de estilo do Google
         bloqueava a primeira pintura e custava DNS + TLS + 2 RTTs para um
         terceiro. O preload abaixo cobre os dois arquivos que praticamente
         todo visitante brasileiro precisa; latin-ext entra sob demanda. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
